<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFF8F2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="自律小窝" />
  <title>自律小窝 · 我的桌面自律小程序</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-512.png" />
  <link rel="icon" type="image/png" href="icons/icon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout-container">
    <!-- 左侧侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-mascot" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="36" height="36">
            <circle cx="32" cy="32" r="30" fill="#FDEFE6"/>
            <circle cx="32" cy="30" r="18" fill="#F7B7A3"/>
            <circle cx="25" cy="28" r="3" fill="#6B5D54"/>
            <circle cx="39" cy="28" r="3" fill="#6B5D54"/>
            <path d="M25 36 Q32 43 39 36" stroke="#6B5D54" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            <circle cx="20" cy="34" r="3" fill="#F7C9BB" opacity="0.8"/>
            <circle cx="44" cy="34" r="3" fill="#F7C9BB" opacity="0.8"/>
            <path d="M32 12 Q29 6 24 8 Q28 10 30 13" fill="#A8D8C9"/>
            <path d="M32 12 Q35 6 40 8 Q36 10 34 13" fill="#C9B6E4"/>
          </svg>
        </div>
        <span class="sidebar-brand">自律小窝</span>
      </div>

      <nav class="sidebar-nav">
        <button class="side-item active" data-target="news" aria-label="每日新闻">
          <span class="side-icon side-icon-news">📰</span>
          <span class="side-label">每日新闻</span>
          <span class="side-bar side-bar-news"></span>
        </button>
        <button class="side-item" data-target="zhengxie" aria-label="政协工作">
          <span class="side-icon side-icon-zhengxie">🏛️</span>
          <span class="side-label">政协工作</span>
          <span class="side-bar side-bar-zhengxie"></span>
        </button>
        <button class="side-item" data-target="gongwen" aria-label="公文学习">
          <span class="side-icon side-icon-gongwen">✍️</span>
          <span class="side-label">公文学习</span>
          <span class="side-bar side-bar-gongwen"></span>
        </button>
      </nav>

      <button class="sidebar-toggle" id="sidebarToggle" aria-label="折叠/展开侧边栏">
        <svg class="toggle-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>

      <div class="sidebar-footer">
        <p class="sidebar-date" id="appDate">加载中…</p>
      </div>
    </aside>

    <!-- 右侧主区域 -->
    <div class="main-area">
      <!-- 顶部 -->
      <header class="app-header">
        <div class="header-inner">
          <div class="header-text">
            <h1 class="app-title" id="panelTitle">每日新闻</h1>
            <p class="app-sub" id="panelSub">来自主流媒体的当日要闻 · 点开看详情</p>
          </div>
          <div class="header-motto" id="dailyMotto">今天也要温柔而坚定地前进呀 🌿</div>
        </div>
      </header>

      <!-- 主体：三大板块 -->
      <main class="app-main">
        <section class="panel" id="panel-news" data-panel="news">
          <div class="card-list" id="list-news"></div>
        </section>
        <section class="panel" id="panel-zhengxie" data-panel="zhengxie" hidden>
          <div class="card-list" id="list-zhengxie"></div>
        </section>
        <section class="panel" id="panel-gongwen" data-panel="gongwen" hidden>
          <div class="card-list" id="list-gongwen"></div>
        </section>
      </main>
    </div>
  </div>

  <!-- 移动端遮罩 -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
