<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FFF8F2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="自律小窝" />
  <title>自律小窝 · 我的桌面自律小程序</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-512.png" />
  <link rel="icon" type="image/png" href="icons/icon-512.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 顶部：应用名 + 日期 + 每日寄语 -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-mascot" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="44" height="44">
          <circle cx="32" cy="32" r="30" fill="#FDEFE6"/>
          <circle cx="32" cy="30" r="18" fill="#F7B7A3"/>
          <circle cx="25" cy="28" r="3" fill="#6B5D54"/>
          <circle cx="39" cy="28" r="3" fill="#6B5D54"/>
          <path d="M25 36 Q32 43 39 36" stroke="#6B5D54" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <circle cx="20" cy="34" r="3" fill="#F7C9BB" opacity="0.8"/>
          <circle cx="44" cy="34" r="3" fill="#F7C9BB" opacity="0.8"/>
          <path d="M32 12 Q29 6 24 8 Q28 10 30 13" fill="#A8D8C9"/>
          <path d="M32 12 Q35 6 40 8 Q36 10 34 13" fill="#C9B6E4"/>
        </svg>
      </div>
      <div class="header-text">
        <h1 class="app-title">自律小窝</h1>
        <p class="app-date" id="appDate">加载中…</p>
      </div>
    </div>
    <p class="daily-motto" id="dailyMotto">今天也要温柔而坚定地前进呀 🌿</p>
  </header>

  <!-- 主体：三大板块 -->
  <main class="app-main">
    <section class="panel" id="panel-news" data-panel="news">
      <div class="panel-head">
        <h2 class="panel-title"><span class="dot dot-news"></span>每日新闻</h2>
        <p class="panel-sub">来自主流媒体的当日要闻 · 点开看详情</p>
      </div>
      <div class="card-list" id="list-news"></div>
    </section>

    <section class="panel" id="panel-zhengxie" data-panel="zhengxie" hidden>
      <div class="panel-head">
        <h2 class="panel-title"><span class="dot dot-zhengxie"></span>政协工作干货</h2>
        <p class="panel-sub">参政议政 & 材料撰写 · 碎片化学习</p>
      </div>
      <div class="card-list" id="list-zhengxie"></div>
    </section>

    <section class="panel" id="panel-gongwen" data-panel="gongwen" hidden>
      <div class="panel-head">
        <h2 class="panel-title"><span class="dot dot-gongwen"></span>公文写作学习</h2>
        <p class="panel-sub">文种写法 · 结构思路 · 每日一练</p>
      </div>
      <div class="card-list" id="list-gongwen"></div>
    </section>
  </main>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-target="news" aria-label="每日新闻">
      <span class="nav-emoji">📰</span>
      <span class="nav-label">每日新闻</span>
    </button>
    <button class="nav-item" data-target="zhengxie" aria-label="政协干货">
      <span class="nav-emoji">🏛️</span>
      <span class="nav-label">政协干货</span>
    </button>
    <button class="nav-item" data-target="gongwen" aria-label="公文写作">
      <span class="nav-emoji">✍️</span>
      <span class="nav-label">公文写作</span>
    </button>
  </nav>

  <!-- 详情浮层 -->
  <div class="modal-mask" id="modalMask" hidden>
    <div class="modal-sheet" id="modalSheet" role="dialog" aria-modal="true">
      <div class="modal-handle"></div>
      <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
